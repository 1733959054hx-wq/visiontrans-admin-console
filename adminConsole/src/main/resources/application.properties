# =============================================================================
#  视界译 VisionTrans · 平台管理后台 Admin Console
#  后端集中配置文件 —— 切换环境 / 迁移部署只需修改本文件
#
#  编码提示：.properties 按规范以 ISO-8859-1 读取，中文"值"必须写成 \uXXXX 转义。
#  在 IDEA 中开启 Settings → Editor → File Encodings →
#  "Transparent native-to-ascii conversion" 后可直接输入中文（自动转义保存）。
# =============================================================================

spring.application.name=adminConsole

# -----------------------------------------------------------------------------
#  1. HTTP 服务
# -----------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
server.tomcat.threads.max=200

# -----------------------------------------------------------------------------
#  2. 日志
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.gzu.adminconsole=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# -----------------------------------------------------------------------------
#  3. 业务自定义配置（一一映射到 AppProperties）
# -----------------------------------------------------------------------------

# 3.1 REST 接口统一前缀
admin-console.api.enabled=true
admin-console.api.base-path=/api

# 3.2 平台品牌与顶栏 / 侧栏展示信息
admin-console.platform.name=\u89c6\u754c\u8bd1 VisionTrans
admin-console.platform.subtitle=VR \u5b9e\u65f6\u89e3\u6790\u4e0e\u7ffb\u8bd1\u7cfb\u7edf
admin-console.platform.console-label=\u5e73\u53f0\u7ba1\u7406\u540e\u53f0 \u00b7 Admin Console
admin-console.platform.group-name=\u5e73\u53f0\u6cbb\u7406
admin-console.platform.cluster-status=\u96c6\u7fa4\u6b63\u5e38
admin-console.platform.cluster-latency=\u7aef\u5230\u7aef 186ms
admin-console.platform.date-range=2026-09-01 ~ 2026-09-30
admin-console.platform.current-user=Danny \u00b7 \u8fd0\u8425\u7ba1\u7406\u5458
admin-console.platform.current-user-id=MT-20873 \u00b7 \u5df2\u5b9e\u540d
admin-console.platform.current-user-avatar=\u8d3a

# 3.3 跨域（前端 dev server 默认 5173；打包部署后改成实际域名）
admin-console.cors.enabled=true
admin-console.cors.allowed-origins[0]=http://localhost:5173
admin-console.cors.allowed-origins[1]=http://127.0.0.1:5173
admin-console.cors.allowed-origins[2]=http://localhost:4173
admin-console.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
admin-console.cors.allowed-headers=*
admin-console.cors.allow-credentials=true
admin-console.cors.max-age=3600

# 3.4 集群运维阈值（用于 SLA 判定与文案展示）
admin-console.cluster.sla-latency-ms=250
admin-console.cluster.design-capacity-qps=1200
admin-console.cluster.sampling-period=5s
admin-console.cluster.data-delay=\u6570\u636e\u65f6\u5ef6 < 1s

# 3.5 安全合规
admin-console.security.log-retention-days=180
# 地理编码 Key（可选，留空即可）：
#   不填 → 自动用 Open-Meteo 免费地理编码（免 Key、免注册，开箱即用，已验证可用）
#   填写 → 优先用腾讯位置服务（lbs.qq.com label2coord），坐标与国内地图同坐标系、更精准
# 申请腾讯 Key：https://lbs.qq.com/dev/console/application/mine → 创建应用选「WebServiceAPI」→ 复制 Key
# admin-console.security.tencent-lbs-key=

# 3.6 演示数据开关
#      randomize   : true 时每次请求对实时指标做轻微随机扰动（模拟推送效果）
#      auto-init   : 首次启动且表为空时，自动灌入一套演示数据
admin-console.data.randomize=false
admin-console.data.auto-init=true

# -----------------------------------------------------------------------------
#  4. 数据库（MySQL 8.x）· 库名 shixun（已存在，无需新建）
#     首次启动请先用 root 执行一次 db/init.sql 完成字符集校正与账号授权；
#     表结构由 JPA 自动维护（ddl-auto=update），无需手工建表。
# -----------------------------------------------------------------------------
# 库名 / 时区等非敏感项可给默认值；账号与口令一律从环境变量注入，缺失即启动失败（禁止弱口令入库）
spring.datasource.url=jdbc:mysql://localhost:3306/shixun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=shixun
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池（HikariCP）
spring.datasource.hikari.pool-name=AdminConsoleHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
# 默认 validate：应用账号不再持有 DDL 权限，结构变更走 Flyway / Liquibase 迁移脚本；
# 本地开发如需自动建表，启动时设置环境变量 ADMIN_DDL_AUTO=update
spring.jpa.hibernate.ddl-auto=${ADMIN_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true

# 如需导出建表脚本排查问题，可改为 create 并配合 ddl-auto=validate 使用
# spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
# spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=ddl.sql
