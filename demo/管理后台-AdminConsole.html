<style>
  :root{
    --navy:#1E3A8A; --abyss:#0B1E4D; --electric:#2563EB; --ice:#0EA5E9;

  }
  *{ -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }

  .card-s{ font-size:11.5px; color:var(--sub); margin-top:2px; }
  .card-b{ padding:16px 18px; }

  /* ---------- 毛玻璃 ---------- */
  .glass{ background:rgba(255,255,255,.78); backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%); }
  .glass-dark{ background:rgba(255,255,255,.06); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.12); }

  /* ---------- 侧栏 ---------- */
  #sidebar{ background:
      radial-gradient(900px 500px at 20% -10%, rgba(37,99,235,.35), transparent 60%),
      linear-gradient(180deg,#0B1E4D 0%, #132A63 45%, #1E3A8A 100%); }
  #sidebar::after{ content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:34px 34px; }
  .nav-item{ position:relative; display:flex; align-items:center; gap:11px; width:100%;
    padding:10px 12px; border-radius:10px; color:rgba(226,232,240,.82); font-size:13.6px;
    cursor:pointer; transition:.18s; z-index:2; }
  .nav-item .nav-ico{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center;
    font-size:13px; background:rgba(255,255,255,.07); color:rgba(226,232,240,.9); transition:.18s; }
  .nav-item:hover{ color:#fff; background:rgba(255,255,255,.07); }
  .nav-item.active{ color:#fff; background:linear-gradient(90deg, rgba(37,99,235,.95), rgba(14,165,233,.55));
    box-shadow:0 6px 18px -8px rgba(14,165,233,.9); }
  .nav-item.active .nav-ico{ background:rgba(255,255,255,.2); color:#fff; }
  .nav-item.active::before{ content:''; position:absolute; left:-18px; top:50%; transform:translateY(-50%);
    width:3px; height:20px; border-radius:0 3px 3px 0; background:#38BDF8; box-shadow:0 0 12px #38BDF8; }
  .nav-sub{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.62; }

  /* ---------- 模式切换 ---------- */
  .seg{ display:flex; gap:4px; padding:4px; border-radius:12px; background:#F1F5F9; border:1px solid var(--line); }
  .seg button{ padding:6px 16px; border-radius:9px; font-size:13px; font-weight:600; color:var(--sub); transition:.18s; }
  .seg button.active{ color:#fff; background:linear-gradient(135deg,#1E3A8A,#2563EB 60%,#0EA5E9);
    box-shadow:0 6px 16px -8px rgba(37,99,235,.9); }

  /* ---------- 组件 ---------- */
  .chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px;
    font-size:12px; border:1px solid var(--line); background:#fff; color:#334155; cursor:pointer; transition:.16s; }
  .chip:hover{ border-color:#93C5FD; color:#1D4ED8; background:#F0F7FF; }
  .chip.on{ border-color:#2563EB; background:#EFF6FF; color:#1D4ED8; font-weight:600;
    box-shadow:0 0 0 3px rgba(37,99,235,.10); }
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
    font-size:11.5px; font-weight:600; }
  .pill-green{ background:#ECFDF5; color:#047857; }
  .pill-blue { background:#EFF6FF; color:#1D4ED8; }
  .pill-amber{ background:#FFFBEB; color:#B45309; }
  .pill-red  { background:#FEF2F2; color:#B91C1C; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 15px;
    border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; transition:.18s; border:1px solid transparent; }
  .btn-primary{ background:linear-gradient(135deg,#1E3A8A,#2563EB); color:#fff; box-shadow:0 8px 20px -10px rgba(37,99,235,.9); }

  /* 进度条 */

  .bar > i{ display:block; height:100%; border-radius:99px;

  .bar.warn > i{ background:linear-gradient(90deg,#B45309,#F59E0B); }
  .bar.danger > i{ background:linear-gradient(90deg,#991B1B,#EF4444); }

  /* 表格 */
  table.tb{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
  table.tb thead th{ text-align:left; padding:10px 14px; font-size:11.5px; font-weight:600; letter-spacing:.04em;

  table.tb tbody tr:last-child td{ border-bottom:none; }
  .td-main{ font-weight:600; color:var(--ink); }
  .td-r{ text-align:right; }

  /* 开关 */
  .sw{ position:relative; width:42px; height:23px; border-radius:99px; background:#CBD5E1; cursor:pointer; transition:.2s; flex:none; }
  .sw::after{ content:''; position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(15,23,42,.3); transition:.2s; }
  .sw.on{ background:linear-gradient(135deg,#2563EB,#0EA5E9); }
  .sw.on::after{ left:21.5px; }

  /* 滑块 */
  input[type=range].rng{ -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:99px; outline:none; }
  input[type=range].rng::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:#fff; border:3px solid #2563EB; box-shadow:0 2px 8px rgba(37,99,235,.5); cursor:pointer; }
  input[type=range].rng::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background:#fff;
    border:3px solid #2563EB; cursor:pointer; }

  /* 滚动条 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#CBD5E1; border-radius:99px; border:2px solid var(--titan); }
  ::-webkit-scrollbar-thumb:hover{ background:#94A3B8; }

  /* 动效 */
  @keyframes pulse-ring{ 0%{ transform:scale(.6); opacity:.9 } 80%,100%{ transform:scale(2.6); opacity:0 } }
  .dot-live{ position:relative; }
  .dot-live::after{ content:''; position:absolute; inset:-4px; border-radius:50%;
    border:2px solid #22D3EE; animation:pulse-ring 1.8s cubic-bezier(.2,.7,.4,1) infinite; }
  @keyframes flow{ to{ stroke-dashoffset:-1000 } }
  .flow-line{ stroke-dasharray:6 6; animation:flow 14s linear infinite; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }
  .page.active .anim{ animation:rise .38s cubic-bezier(.2,.7,.4,1) both; }

  /* 页面容器 */
  .page{ display:none; }
  .page.active{ display:block; }

  /* 二维码 */
  .qr{ image-rendering:pixelated; }

  /* 打印 / 截图 */
  @media print{
    .no-print{ display:none !important; }
    #sidebar{ display:none !important; }
    body{ background:#fff; }
    .page{ display:none !important; }
    .page.active{ display:block !important; }
  }
  /* 长截图模式：解除整页滚动锁定，便于一次性截取完整页面 */
  body.longshot{ height:auto; overflow:visible; }
  body.longshot > div{ height:auto !important; overflow:visible !important; }
  body.longshot #viewport{ overflow:visible !important; height:auto !important; }
  body.longshot #sidebar{ position:sticky; top:0; align-self:flex-start; height:100vh; }
  .shot-toolbar{ position:fixed; right:18px; bottom:18px; z-index:60; display:flex; gap:8px;

  .shot-toolbar button{ width:34px; height:34px; border-radius:9px; color:#475569; display:grid; place-items:center; transition:.16s; }
  .shot-toolbar button:hover{ background:#EFF6FF; color:#1D4ED8; }
</style>

<script>
/* =========================================================================
   视界译 VisionTrans · PC 端高保真原型
   纯原生 JS + Tailwind CDN + FontAwesome；所有图表由 SVG 运行时绘制
   ========================================================================= */

/* ------------------------------ 数据字典 ------------------------------ */
const NAV = {
  admin: {
    group:'平台治理', name:'平台管理后台 · Admin Console', icon:'fa-server',
    items:[
      { id:'a6',  icon:'fa-satellite-dish', text:'集群态势感知',    sub:'Cluster Ops',      title:'集群态势感知与推演监控大盘' },
      { id:'a7',  icon:'fa-brain',          text:'AI 模型与热更',   sub:'Model Lifecycle',  title:'AI 模型生命周期与热更中心' },
      { id:'a8',  icon:'fa-language',       text:'术语库与 UGC 风控', sub:'Moderation',     title:'语种术语库审核与 UGC 风控中台' },
      { id:'a9',  icon:'fa-calendar-day',   text:'广告位排期引擎',  sub:'Scheduler',        title:'全网广告位排期与调度引擎' },
      { id:'a10', icon:'fa-shield-halved',  text:'安全风控与 RBAC', sub:'Security & RBAC',  title:'安全风控、设备审计与 RBAC 权限' },
    ]
  }
};

const STATE = { mode:'admin', page:'a6', side:true };
const RENDERED = new Set();

/* ------------------------------ 通用工具 ------------------------------ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const fmt = n => (n??0).toLocaleString('en-US');
const money = (n,d=2)=> '¥' + (n).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});

function svg(tag, attrs={}, parent=null){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs){ if(attrs[k]!==undefined && attrs[k]!==null) el.setAttribute(k, attrs[k]); }
  if(parent) parent.appendChild(el);
  return el;
}
function mkSVG(w,h,cls=''){
  const s = svg('svg');
  s.setAttribute('viewBox', `0 0 ${w} ${h}`);
  s.setAttribute('width','100%'); s.setAttribute('height',h);
  s.setAttribute('preserveAspectRatio','none');
  if(cls) s.setAttribute('class', cls);
  return s;
}
function defsGradient(s, id, c1, c2, vertical=true){
  const d = svg('defs',{},s);
  const g = svg('linearGradient',{id, x1:'0', y1:'0', x2: vertical?'0':'1', y2: vertical?'1':'0'}, d);
  svg('stop',{offset:'0%',  'stop-color':c1, 'stop-opacity':'.42'}, g);
  svg('stop',{offset:'100%','stop-color':c2, 'stop-opacity':'0'}, g);
  return id;
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* --------------------------- SVG 图表引擎 --------------------------- */
/**
 * 折线 / 面积混合图（支持双 Y 轴）
 * opt: { labels, series:[{name,data,color,type:'area'|'line',axis:'left'|'right',dashed}],
 *        height, yFmtL, yFmtR, ticks:5, dots:true }
 */
function chart(el, opt){
  el.innerHTML = '';
  const labels = opt.labels, series = opt.series, h = opt.height||260;
  const W = Math.max(el.clientWidth || 900, 320);
  const pad = Object.assign({t:18, r:18, b:30, l:58}, opt.pad||{});
  const iw = W - pad.l - pad.r, ih = h - pad.t - pad.b;
  const s = mkSVG(W,h);
  const axes = { left:{max:0,min:0}, right:{max:0,min:0} };
  series.forEach(se=>{
    const ax = axes[se.axis||'left'];
    ax.max = Math.max(ax.max, Math.max(...se.data));
  });
  axes.left.max  = opt.maxL  ?? (axes.left.max*1.18  || 1);
  axes.right.max = opt.maxR  ?? (axes.right.max*1.25 || 1);
  const ticks = opt.ticks||5;

  // 网格 + 左轴刻度
  for(let i=0;i<=ticks;i++){
    const y = pad.t + ih - ih*i/ticks;
    svg('line',{x1:pad.l, y1:y, x2:W-pad.r, y2:y, stroke:'#EEF2F7','stroke-width':1}, s);
    const t = svg('text',{x:pad.l-10, y:y+4, 'text-anchor':'end', 'font-size':'10.5', fill:'#94A3B8',
      'font-family':'JetBrains Mono, monospace'}, s);
    t.textContent = (opt.yFmtL||(v=>Math.round(v)))(axes.left.max*i/ticks);
  }
  if(opt.maxR || series.some(x=>x.axis==='right')){
    for(let i=0;i<=ticks;i++){
      const y = pad.t + ih - ih*i/ticks;
      const t = svg('text',{x:W-pad.r+8, y:y+4, 'text-anchor':'start','font-size':'10.5',fill:'#94A3B8',
        'font-family':'JetBrains Mono, monospace'}, s);

/** 分组柱状图（支持双 Y 轴：series[].axis = 'right'） */
function barChart(el, opt){
  el.innerHTML='';
  const labels=opt.labels, series=opt.series, h=opt.height||240;
  const W=Math.max(el.clientWidth||900,320);
  const hasR = series.some(x=>x.axis==='right');
  const pad=Object.assign({t:16, r:hasR?56:16, b:30, l:56}, opt.pad||{});
  const iw=W-pad.l-pad.r, ih=h-pad.t-pad.b;
  const s=mkSVG(W,h);
  const mL = opt.max  ?? (Math.max(...series.filter(x=>x.axis!=='right').flatMap(x=>x.data))*1.2 || 1);
  const mR = opt.maxR ?? (Math.max(...series.filter(x=>x.axis==='right').flatMap(x=>x.data))*1.2 || 1);
  const ticks=4;
  const fmtL = opt.yFmt  || (v=>Math.round(v));
  const fmtR = opt.yFmtR || (v=>Math.round(v));
  for(let i=0;i<=ticks;i++){
    const y=pad.t+ih-ih*i/ticks;
    svg('line',{x1:pad.l,y1:y,x2:W-pad.r,y2:y,stroke:'#EEF2F7'},s);
    const t=svg('text',{x:pad.l-10,y:y+4,'text-anchor':'end','font-size':'10.5',fill:'#94A3B8',
      'font-family':'JetBrains Mono, monospace'},s);
    t.textContent=fmtL(mL*i/ticks);
    if(hasR){
      const t2=svg('text',{x:W-pad.r+8,y:y+4,'text-anchor':'start','font-size':'10.5',fill:'#94A3B8',
        'font-family':'JetBrains Mono, monospace'},s);
      t2.textContent=fmtR(mR*i/ticks);
    }
  }
  const gw=iw/labels.length, bw=Math.min(opt.barW||22, (gw-10)/series.length);
  labels.forEach((lb,i)=>{
    const cx=pad.l+gw*i+gw/2;
    series.forEach((se,k)=>{
      const v=se.data[i], bh=ih*v/(se.axis==='right'?mR:mL);

      svg('stop',{offset:'0%','stop-color':se.c1},g); svg('stop',{offset:'100%','stop-color':se.c2},g);
      const r=svg('rect',{x, y:pad.t+ih-bh, width:bw, height:Math.max(bh,1), rx:4, fill:`url(#${gid})`},s);
      const ti=svg('title',{},r); ti.textContent=`${lb} · ${se.name}：${fmt(v)}`;
    });
    const t=svg('text',{x:cx,y:h-9,'text-anchor':'middle','font-size':'10.5',fill:'#94A3B8'},s);
    t.textContent=lb;
  });
  el.appendChild(s);
  if(opt.legend!==false){

/** 双色渐变波形图（端到端延迟拆解：堆叠面积 + 顶部波形） */
function waveChart(el, opt){
  el.innerHTML='';
  const W=Math.max(el.clientWidth||900,320), h=opt.height||280;
  const pad=Object.assign({t:16,r:18,b:28,l:56},opt.pad||{});
  const iw=W-pad.l-pad.r, ih=h-pad.t-pad.b;
  const s=mkSVG(W,h);
  const n=opt.points;                       // 采样点数量
  const layers=opt.layers;                  // [{name,c1,c2,fn}]
  const total=i=>layers.reduce((a,l)=>a+l.fn(i),0);
  const maxY=opt.max || Math.max(...Array.from({length:n},(_,i)=>total(i)))*1.12;
  const X=i=>pad.l+iw*i/(n-1), Y=v=>pad.t+ih-ih*v/maxY;

  for(let k=0;k<=4;k++){
    const y=pad.t+ih-ih*k/4;
    svg('line',{x1:pad.l,y1:y,x2:W-pad.r,y2:y,stroke:'#EEF2F7'},s);
    const t=svg('text',{x:pad.l-10,y:y+4,'text-anchor':'end','font-size':'10.5',fill:'#94A3B8',
      'font-family':'JetBrains Mono, monospace'},s);
    t.textContent=Math.round(maxY*k/4)+(opt.unit||'');
  }
  // 堆叠层（自上而下绘制，底层最后）
  const cum=new Array(n).fill(0);
  layers.slice().reverse().forEach(l=>{
    const top=[], bot=[];
    for(let i=0;i<n;i++){ bot.push([X(i), Y(cum[i])]); cum[i]+=l.fn(i); top.push([X(i), Y(cum[i])]); }
    const d=top.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+
            ' '+ bot.slice().reverse().map((p,i)=>(i?'L':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+' Z';
    const gid='wg'+Math.random().toString(36).slice(2,8);
    const defs=svg('defs',{},s), g=svg('linearGradient',{id:gid,x1:'0',y1:'0',x2:'0',y2:'1'},defs);
    svg('stop',{offset:'0%','stop-color':l.c1,'stop-opacity':'.85'},g);
    svg('stop',{offset:'100%','stop-color':l.c2,'stop-opacity':'.35'},g);
    svg('path',{d, fill:`url(#${gid})`, stroke:l.c1,'stroke-width':1.2,'stroke-opacity':'.55'},s);
  });
  // 顶部总延迟曲线
  const cum2=new Array(n).fill(0);
  const tops=[];
  for(let i=0;i<n;i++){ layers.forEach(l=>cum2[i]+=l.fn(i)); tops.push([X(i),Y(cum2[i])]); }
  svg('path',{d:tops.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),
    fill:'none', stroke:'#1E3A8A','stroke-width':2.2,'stroke-linejoin':'round'},s);
  // 时间轴
  (opt.labels||[]).forEach(lb=>{
    const x=pad.l+iw*lb.at/(n-1);
    svg('line',{x1:x,y1:pad.t,x2:x,y2:pad.t+ih,stroke:'#E2E8F0','stroke-dasharray':'3 3'},s);
    const t=svg('text',{x,y:h-8,'text-anchor':'middle','font-size':'10.5',fill:'#94A3B8'},s);
    t.textContent=lb.t;
  });
  el.appendChild(s);
  if(opt.legend!==false){
    const lg=document.createElement('div');
    lg.className='flex flex-wrap items-center gap-x-5 gap-y-1.5 mt-2 px-1';
    lg.innerHTML=layers.slice().reverse().map(l=>
      `<span class="inline-flex items-center gap-1.5 text-[11.5px] text-sub">
        <i style="width:9px;height:9px;border-radius:3px;background:linear-gradient(180deg,${l.c1},${l.c2});display:inline-block"></i>${l.name}</span>`).join('')
      + `<span class="inline-flex items-center gap-1.5 text-[11.5px] text-sub"><i style="width:9px;height:2px;background:#1E3A8A;display:inline-block"></i>端到端总延迟</span>`;
    el.appendChild(lg);
  }
}

/** 迷你 Sparkline */
function spark(el, data, color='#2563EB', h=34){
  el.innerHTML='';
  const W=Math.max(el.clientWidth||120,60);
  const s=mkSVG(W,h);
  const max=Math.max(...data), min=Math.min(...data), rg=(max-min)||1;
  const X=i=>i*(W-4)/(data.length-1)+2, Y=v=>h-4-((v-min)/rg)*(h-9);
  const gid='sg'+Math.random().toString(36).slice(2,7);
  defsGradient(s,gid,color,color);
  const d=data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  svg('path',{d:d+` L ${X(data.length-1).toFixed(1)} ${h} L 2 ${h} Z`, fill:`url(#${gid})`},s);
  svg('path',{d, fill:'none', stroke:color,'stroke-width':1.8,'stroke-linecap':'round'},s);
  el.appendChild(s);
}

/** 二维码（确定性伪随机矩阵） */
function qrCode(el, seedStr, size=168){
  const N=25, cell=size/N;
  let seed=0; for(const ch of seedStr) seed=(seed*131+ch.charCodeAt(0))>>>0;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const s=mkSVG(size,size); s.setAttribute('preserveAspectRatio','xMidYMid meet');
  s.style.width=size+'px'; s.style.height=size+'px';
  svg('rect',{x:0,y:0,width:size,height:size,fill:'#fff'},s);
  const inFinder=(r,c)=> (r<8&&c<8)||(r<8&&c>=N-8)||(r>=N-8&&c<8);
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    if(inFinder(r,c)) continue;
    if(rnd()>0.52) svg('rect',{x:c*cell,y:r*cell,width:cell,height:cell,fill:'#0F172A'},s);
  }
  const finder=(ox,oy)=>{
    svg('rect',{x:ox*cell,y:oy*cell,width:cell*7,height:cell*7,fill:'#0F172A'},s);
    svg('rect',{x:(ox+1)*cell,y:(oy+1)*cell,width:cell*5,height:cell*5,fill:'#fff'},s);
    svg('rect',{x:(ox+2)*cell,y:(oy+2)*cell,width:cell*3,height:cell*3,fill:'#1E3A8A'},s);
  };
  finder(0,0); finder(N-7,0); finder(0,N-7);
  for(let i=8;i<N-8;i++){ if((i%2)===0){ svg('rect',{x:i*cell,y:6*cell,width:cell,height:cell,fill:'#0F172A'},s);
                                        svg('rect',{x:6*cell,y:i*cell,width:cell,height:cell,fill:'#0F172A'},s); } }
  el.appendChild(s);
}

function buildSidebar(){

function go(id){
  if(!NAV[STATE.mode].items.some(i => i.id === id)) id = NAV[STATE.mode].items[0].id;
  STATE.page = id;
  $$('#navlist .nav-item').forEach(n=> n.classList.toggle('active', n.dataset.go===id));
  $$('.page').forEach(p=> p.classList.remove('active'));
  const page = $('#page-'+id);
  page.classList.add('active');
  const meta = NAV[STATE.mode].items.find(i=>i.id===id);
  $('#hd-title').textContent = meta.title;
  $('#hd-crumb').textContent = `${STATE.mode==='merchant'?'商户端':'平台管理后台'} / ${meta.title} / ${meta.sub}`;
  $('#viewport').scrollTop = 0;
  if(!RENDERED.has(id)){ (window.CHARTS[id]||(()=>{}))(); RENDERED.add(id); }
  else { (window.CHARTS[id]||(()=>{}))(); }
}

function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
function toggleSide(){
  STATE.side = !STATE.side;
  $('#sidebar').style.display = STATE.side ? '' : 'none';
}
function toggleLong(){
  document.body.classList.toggle('longshot');
}

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const k=e.key.toLowerCase();
  if(k==='f') toggleFull();
  if(k==='h') toggleSide();
  if(k==='l') toggleLong();
  if(k==='p'){ e.preventDefault(); window.print(); }
  const list = NAV[STATE.mode].items.map(i=>i.id);
  const i = list.indexOf(STATE.page);
  if(e.key==='ArrowDown' && i<list.length-1) go(list[i+1]);
  if(e.key==='ArrowUp'   && i>0)             go(list[i-1]);
});

let rt;
window.addEventListener('resize', ()=>{
  clearTimeout(rt); rt=setTimeout(()=>{ (window.CHARTS[STATE.page]||(()=>{}))(); }, 220);
});

      <div class="card-h">
        <div><div class="card-t">管理员操作日志（180 天不可篡改）</div>
          <div class="card-s">采用追加写入 + 区块链哈希链式存证，任何管理员（含超管）均无法修改或删除</div></div>

          <tbody>
            ${logs.map(l=>`
            <tr>
              <td class="num text-[12.5px]">${l[0]}</td>
              <td><div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-lg grid place-items-center text-[9.5px] font-bold text-white"
                      style="background:linear-gradient(135deg,#0B1E4D,#2563EB)">${l[1].slice(0,1)}</span>
                <span class="text-[12.5px] font-medium">${l[1]}</span></div></td>
              <td><span class="pill pill-slate">${l[2]}</span></td>
              <td class="text-[12.5px]">${l[3]}</td>
              <td class="num text-[11.5px] text-sub">${l[4]}</td>
              <td><span class="pill ${l[5]==='成功'?'pill-green':l[5]==='已拦截'?'pill-red':'pill-amber'}">${l[5]}</span></td>
              <td class="num text-[11px] text-sub"><i class="fa-solid fa-link text-[9px] text-ice mr-1"></i>${l[6]}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="card-h !border-b-0 !border-t border-line">
        <span class="text-[11.5px] text-sub">显示 1–8 条，共 1,864,208 条 · 留存期 180 天（2026-03-07 ~ 2026-09-03）</span>
        <div class="flex items-center gap-1">
          <button class="btn btn-ghost btn-sm">上一页</button>
          <button class="btn btn-primary btn-sm !w-8 !px-0">1</button>
          <button class="btn btn-ghost btn-sm">下一页</button>
        </div>
      </div>
    </div>

      </div>`;
    };

/* =======================================================================
   CHARTS —— 各页面的图表渲染（页面首次显示时按需绘制，随窗口缩放重绘）
   ======================================================================= */
window.CHARTS = {};

function renderCommon(id){
  const p = $('#page-'+id);
  if(!p) return;
  p.querySelectorAll('[data-spark]').forEach(el=>{
    spark(el, el.dataset.spark.split(',').map(Number), el.dataset.color || '#2563EB');
  });
  p.querySelectorAll('[data-qr]').forEach(el=> qrCode(el, el.dataset.qr, 168));
}

/* ---- 10 · 安全风控、设备审计与 RBAC 权限 ---- */
window.CHARTS.a10 = ()=>{
  renderCommon('a10');
  const el = $('#page-a10 [data-chart="a10-map"]');
  el.innerHTML='';
  const W=Math.max(el.clientWidth||860,420), H=360;
  const s=mkSVG(W,H);
  const PX = lon => (lon+180)/360*W;
  const PY = lat => (84-lat)/144*H;

  // 海洋背景
  const gid='ocean'+Math.random().toString(36).slice(2,6);
  const defs=svg('defs',{},s), g=svg('linearGradient',{id:gid,x1:'0',y1:'0',x2:'0',y2:'1'},defs);
  svg('stop',{offset:'0%','stop-color':'#F8FBFF'},g);
  svg('stop',{offset:'100%','stop-color':'#EFF6FF'},g);
  svg('rect',{x:0,y:0,width:W,height:H,fill:`url(#${gid})`,rx:10},s);

  // 经纬网格
  for(let lon=-180;lon<=180;lon+=30) svg('line',{x1:PX(lon),y1:0,x2:PX(lon),y2:H,stroke:'#E2E8F0','stroke-width':.8},s);
  for(let lat=60;lat>=-60;lat-=30)   svg('line',{x1:0,y1:PY(lat),x2:W,y2:PY(lat),stroke:'#E2E8F0','stroke-width':.8},s);

  // 大陆轮廓（经纬度多边形 → 等距圆柱投影）
  const MAP = {
    'NA':[[-168,65],[-160,71],[-140,70],[-125,70],[-100,73],[-80,73],[-60,60],[-55,50],[-65,45],[-70,41],
          [-75,35],[-81,25],[-97,26],[-105,20],[-115,30],[-125,40],[-125,48],[-135,58],[-150,60]],
    'SA':[[-81,8],[-70,12],[-60,10],[-50,0],[-35,-5],[-38,-15],[-48,-25],[-58,-35],[-62,-40],[-65,-50],
          [-70,-55],[-75,-45],[-72,-35],[-71,-20],[-78,-5]],
    'EU':[[-10,36],[0,44],[5,50],[8,55],[12,58],[20,60],[30,62],[40,60],[45,50],[40,45],[30,45],[28,40],
          [20,40],[15,38],[5,43],[-5,43]],
    'AF':[[-17,15],[-16,25],[-5,35],[10,37],[25,32],[35,31],[43,12],[51,12],[42,-2],[40,-15],[35,-25],[25,-34],
          [18,-34],[12,-18],[9,-2],[5,5],[-8,5]],
    'AS':[[45,50],[60,55],[75,70],[90,75],[105,77],[130,72],[145,70],[160,70],[170,65],[160,60],[143,52],
          [135,45],[127,38],[122,30],[110,20],[100,12],[95,20],[90,22],[80,8],[72,20],[65,25],[58,22],[50,28],[45,38]],
    'AU':[[113,-22],[122,-18],[130,-12],[142,-11],[150,-22],[153,-28],[148,-38],[140,-38],[130,-32],[115,-34]]
  };
  Object.values(MAP).forEach(poly=>{
    svg('path',{ d: poly.map((p,i)=>(i?'L':'M')+PX(p[0]).toFixed(1)+' '+PY(p[1]).toFixed(1)).join(' ')+' Z',
      fill:'#DBEAFE', stroke:'#93C5FD','stroke-width':1 }, s);
  });

  // 监控点位
  const pts = [
    { n:'上海',   lon:121.47, lat:31.23, s:842,  k:'bad'  },
    { n:'北京',   lon:116.40, lat:39.90, s:1204, k:'ok'   },
    { n:'东京',   lon:139.69, lat:35.68, s:986,  k:'ok'   },
    { n:'新加坡', lon:103.82, lat:1.35,  s:386,  k:'warn' },
    { n:'迪拜',   lon:55.27,  lat:25.20, s:208,  k:'ok'   },
    { n:'法兰克福',lon:8.68,  lat:50.11, s:512,  k:'ok'   },
    { n:'旧金山', lon:-122.42,lat:37.77, s:248,  k:'warn' },
    { n:'圣保罗', lon:-46.63, lat:-23.55,s:164,  k:'bad'  },
  ];
  const COLOR = { ok:'#10B981', warn:'#F59E0B', bad:'#EF4444' };
  const hub = pts[0];
  // 流量连线（汇聚至上海枢纽）
  pts.slice(1).forEach(p=>{
    const x1=PX(hub.lon), y1=PY(hub.lat), x2=PX(p.lon), y2=PY(p.lat);
    const mx=(x1+x2)/2, my=(y1+y2)/2 - Math.abs(x2-x1)*0.16 - 18;
    svg('path',{ d:`M${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`, fill:'none',
      stroke:COLOR[p.k], 'stroke-width':1.1, 'stroke-opacity':'.45', class:'flow-line' }, s);
  });
  pts.forEach(p=>{
    const x=PX(p.lon), y=PY(p.lat), r=Math.max(4, Math.min(11, p.s/140));
    if(p.k!=='ok'){
      const ring=svg('circle',{cx:x,cy:y,r,fill:'none',stroke:COLOR[p.k],'stroke-width':1.4},s);
      svg('animate',{attributeName:'r', values:`${r};${r*3.4}`, dur:'2.4s', repeatCount:'indefinite'},ring);
      svg('animate',{attributeName:'opacity', values:'0.85;0', dur:'2.4s', repeatCount:'indefinite'},ring);
    }
    svg('circle',{cx:x,cy:y,r,fill:COLOR[p.k],'fill-opacity':'.9',stroke:'#fff','stroke-width':2},s);
    const lb=svg('text',{x, y:y-r-7, 'text-anchor':'middle','font-size':'10.5',fill:'#334155','font-weight':'600'},s);
    lb.textContent = p.n;
    const sb=svg('text',{x, y:y+r+13, 'text-anchor':'middle','font-size':'9.5',fill:'#64748B',
      'font-family':'JetBrains Mono, monospace'},s);
    sb.textContent = fmt(p.s)+' 会话';
  });
  el.appendChild(s);
};

/* ------------------------------ 启动 ------------------------------ */
function boot(){
  $('#viewport').innerHTML = Object.keys(PAGES).map(id=>
    `<section id="page-${id}" class="page"></section>`).join('');
  Object.keys(PAGES).forEach(id=>{ $('#page-'+id).innerHTML = PAGES[id](); });
  buildSidebar();
  // 支持 ?page=a6 或 #a6 深链直达，便于逐页全屏截图 / 打印
  const q = new URLSearchParams(location.search).get('page') || location.hash.replace('#','');
  go(PAGES[q] ? q : 'a6');
}
boot();
</script>
